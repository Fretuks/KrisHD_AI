<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in &middot; Elsewhere</title>
<link rel="icon" href="/favicon.svg">
<script src="/app/theme-bootstrap.js?v=20260909-account-controls">
</script>
<link rel="stylesheet" href="/style.css?v=20260909-account-controls">
<link rel="stylesheet" href="/pages.css?v=20260909-account-controls">
<link rel="stylesheet" href="/shell.css?v=20260909-account-controls">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="site-page account-page">
<!-- site-header -->
<main id="main" class="account-layout page-content">
<section class="account-intro">
<p class="eyebrow">Welcome to elsewhere</p>
<h1 id="accountHeadline">Pick up where<br>curiosity left off.</h1>
<p>A space for your ideas, your characters, and the conversations worth coming back to.</p>
<a href="/">&larr; Back to Elsewhere</a>
</section>
<section class="account-box">
<h2 id="accountTitle">Sign in</h2>
<p id="accountDescription" class="muted">Welcome back. Your conversations are waiting.</p>
<form id="accountForm">
<label class="field">
<span>Username</span>
<input name="username" autocomplete="username" required minlength="3">
</label>
<div class="field">
<label for="accountPassword">Password</label>
<div class="password-input">
<input id="accountPassword" name="password" type="password" autocomplete="current-password" required minlength="6">
<button type="button" id="showPassword" class="icon-button password-toggle" aria-label="Show password" title="Show password" aria-controls="accountPassword" aria-pressed="false">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg>
</button>
</div>
</div>
<label id="inviteField" class="field hidden">
<span>Invite code</span>
<input name="inviteCode" autocomplete="off">
</label>
<label id="consentField" class="consent-container hidden">
<input name="consent" type="checkbox">
<span>I agree to the <a href="/tos.html" target="_blank" rel="noopener">Terms</a> and <a href="/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</span>
</label>
<div id="accountStatus" class="account-status hidden" role="status" aria-live="polite" aria-atomic="true" tabindex="-1">
<svg class="account-error-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 3v1"/></svg>
<span id="accountStatusText"></span>
</div>
<button id="accountSubmit" class="primary-action" type="submit">Sign in</button>
</form>
<p id="accountSwitch">
</p>
</section>
</main>
<footer class="site-footer">
<a class="site-brand" href="/">elsewhere</a>
<span>A space for every conversation.</span>
<a href="/privacy.html">Privacy</a>
<a href="/tos.html">Terms</a>
</footer>
<script type="module" src="/pages.js?v=20260909-account-controls">
</script>
<script type="module" src="/app/workspaceNavigation.js?v=20260909-account-controls"></script>
</body>
</html>
